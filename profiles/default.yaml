# Profile = what cards look like and what things are called. Nothing here is in the code.
# Use your own: copy to $DATA_DIR/profile.yaml (or point PROFILE at a file).
#
# A card = item_fields + its category's fields + its type's fields.
# The same key at a deeper level overrides the upper one (e.g. photo optional for resistors).
# Field types: text, markdown, number, link, choice (needs `options`), photo (one or more pictures), files.
# `search`: weight in text search (name always weighs 3). `required`: must be filled.
# `default`: a choice picked in until changed; the unit field's also stands for an empty one.
# Type keys are stored in the database: rename labels freely, keep keys.

name: Мастерская

terms:
  box: Коробка
  boxes: Коробки
  item: Предмет
  items: Предметы
  place: Место
  places: Места
  shelf: Полка
  shelves: Полки
  hands: На руках
  transit: В пути
  reorder: Докупить
  unit: шт

item_fields:
  - key: photo
    label: Фото
    type: photo
    required: true
  - key: aliases
    label: Другие названия
    type: text
    hint: через запятую — как ещё это называют (понижайка, buck, step-down)
    search: 2
  - key: description
    label: Описание
    type: markdown
    search: 1
  - key: files
    label: Файлы
    type: files
  - key: reorder_at
    label: Докупить, когда останется меньше
    type: number
    reorder: true  # the list's «докупить» chip compares this with what is here and «в пути»
  - key: unit
    label: Единица
    type: choice
    options: [шт, м, см, г, мл]
    unit: true  # what the thing's quantities count; empty: the type's `default`, else terms.unit

categories:
  - key: electronics
    label: Компоненты
    fields:
      - key: description
        hint: "разделы: что это, простыми словами → 3–5 главных характеристик → подключение к ESP32 (если не сказано к чему) → подводные камни → ссылки на инструкции. Без жаргона; не уверен — «сверьте с шелкографией»"
      - key: datasheet
        label: Даташит
        type: link
    types:
      - key: mcu_module
        label: Микропроцессорный модуль
        hint: ESP32, Arduino, RP2040 — плата с контроллером
        fields:
          - key: chip
            label: Чип
            type: text
            search: 2
          - key: voltage
            label: Питание
            type: text
            hint: 3.3 В, 5 В через USB
          - key: radio
            label: Радио
            type: text
            search: 2
            hint: Wi-Fi, BLE, LoRa
          - key: flash_psram
            label: Flash / PSRAM
            type: text
            hint: 4 МБ / 2 МБ
          - key: usb
            label: USB
            type: text
            hint: CH340, CP2102, нативный
          - key: pinout
            label: Распиновка
            type: markdown
            required: true
      - key: module
        label: Модуль
        hint: датчики, драйверы, дисплеи, реле
        fields:
          - key: chip
            label: Чип
            type: text
            search: 2
            hint: BME280, INA219
          - key: voltage
            label: Питание
            type: text
          - key: logic
            label: Логический уровень
            type: choice
            options: [3.3 В, 5 В, оба]
          - key: interface
            label: Интерфейс
            type: text
            search: 2
            hint: I2C, SPI, UART, 1-Wire, аналог
          - key: i2c_address
            label: Адрес I2C
            type: text
            search: 3
            hint: "0x76"
          - key: pinout
            label: Распиновка
            type: markdown
            required: true
          - key: firmware
            label: ESPHome / Arduino
            type: link
            hint: страница компонента ESPHome или библиотека Arduino
      - key: power_module
        label: Модуль питания
        hint: понижайка, повышайка, зарядка, защита аккумулятора
        fields:
          - key: chip
            label: Чип
            type: text
            search: 2
            hint: MP1584, LM2596, TP4056
          - key: vin
            label: Вход, В
            type: text
            required: true
            hint: 4.5–28
          - key: vout
            label: Выход, В
            type: text
            required: true
            hint: 0.8–20 или 5
          - key: current
            label: Ток, А
            type: text
            required: true
            hint: "3"
          - key: efficiency
            label: КПД
            type: text
            hint: до 92%
          - key: adjust
            label: Регулировка
            type: choice
            options: [подстроечник, фиксированный]
      - key: battery
        label: Аккумулятор, батарейка
        hint: 18650, LiPo, AA, CR2032
        fields:
          - key: photo
            required: false
          - key: chemistry
            label: Химия
            type: choice
            required: true
            search: 2
            options: [Li-ion, LiPo, LiFePO4, NiMH, щелочная, литиевая]
          - key: voltage
            label: Напряжение
            type: text
            required: true
            hint: 3.7 В, 1.5 В
          - key: capacity
            label: Ёмкость
            type: text
            required: true
            hint: 2600 мА·ч
          - key: connector
            label: Разъём
            type: text
            hint: JST-PH 2.0, выводы под пайку, без разъёма
          - key: protection
            label: Защита встроена
            type: choice
            options: [да, нет]
      - key: resistor
        label: Резистор
        fields:
          - key: photo
            required: false
          - key: value
            label: Номинал
            type: text
            required: true
            search: 3
            hint: 10 кОм, 4.7к
          - key: power
            label: Мощность
            type: text
            hint: 0.25 Вт
          - key: tolerance
            label: Допуск
            type: text
            hint: 1%, 5%
          - key: package
            label: Корпус
            type: choice
            options: [выводной, "0402", "0603", "0805", "1206"]
      - key: capacitor
        label: Конденсатор
        fields:
          - key: photo
            required: false
          - key: value
            label: Ёмкость
            type: text
            required: true
            search: 3
            hint: 100 нФ, 10 мкФ
          - key: voltage
            label: Напряжение
            type: text
          - key: dielectric
            label: Тип
            type: choice
            options: [керамический, электролитический, танталовый, плёночный]
            search: 2
      - key: connector
        label: Разъём
        hint: JST, Dupont, клеммники
        fields:
          - key: series
            label: Серия
            type: text
            search: 3
            hint: JST-XH, JST-PH, Dupont
          - key: pitch
            label: Шаг, мм
            type: number
          - key: pins
            label: Контактов
            type: number
          - key: gender
            label: Папа / мама
            type: choice
            options: [папа, мама, пара]
      - key: electronics_other
        label: Другое

  - key: tools
    label: Инструменты
    types:
      - key: hand_tool
        label: Ручной инструмент
        hint: отвёртки, клещи, кусачки, пинцеты
      - key: power_tool
        label: Электроинструмент
        hint: паяльник, фен, дрель, гравёр
      - key: meter
        label: Измерительный прибор
        hint: мультиметр, осциллограф, штангенциркуль
      - key: tools_other
        label: Другое

  - key: consumables
    label: Расходники
    fields:
      - key: photo
        required: false
    types:
      - key: solder
        label: Для пайки
        hint: припой, флюс, оплётка
      - key: wire
        label: Провод
        hint: МГТФ, силиконовый, витая пара, термоусадка
        fields:
          - key: unit
            default: м
          - key: gauge
            label: Сечение
            type: text
            search: 2
            hint: 0.5 мм², 22 AWG
      - key: fasteners
        label: Крепёж
        hint: винты, гайки, стойки, стяжки
        fields:
          - key: size
            label: Размер
            type: text
            search: 3
            hint: M3×8
      - key: consumables_other
        label: Другое
        hint: изолента, клей, скотч
