<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f6feb">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js")</script>
<title>{% block title %}{{ t.items }}{% endblock %}</title>
<style>
:root{--bg:#f7f6f2;--fg:#1d1d1b;--mut:#6b6b66;--line:#e2e1dc;--card:#fff;--acc:#1f6feb;--bad:#c62828}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--fg:#ecebe6;--mut:#9a9993;--line:#34342f;--card:#1f1f1d;--acc:#58a6ff;--bad:#ef5350}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,sans-serif}
main{max-width:720px;margin:0 auto;padding:8px 16px 64px}
nav{display:flex;gap:2px;overflow-x:auto;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--card)}
nav a{padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--fg);white-space:nowrap}
nav a:hover{background:var(--line)}
a{color:var(--acc)}
h1{font-size:1.45rem;margin:.6em 0 .2em}
h2{font-size:1.1rem;margin:1.3em 0 .4em}
.mut{color:var(--mut);font-size:.9em}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.right{margin-left:auto}
input,select,textarea,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
input,select,textarea{width:100%}
.row input,.row select{width:auto;flex:1;min-width:0}
.row input[type=number]{flex:0 0 5.5em}
textarea{min-height:8em}
button,.btn{cursor:pointer;background:var(--acc);color:#fff;border:0;text-decoration:none;display:inline-block;padding:9px 14px;border-radius:8px}
.ghost{background:transparent;color:var(--acc);border:1px solid var(--line)}
.bad{background:var(--bad)}
label{display:block;margin:14px 0 4px;font-weight:600}
.err{color:var(--bad)}
img.photo{width:100%;max-height:60vh;object-fit:contain;border-radius:12px;background:var(--line)}
.thumb{width:52px;height:52px;object-fit:cover;border-radius:8px;flex:none;background:var(--line)}
a.line{display:flex;gap:10px;align-items:center;text-decoration:none;color:inherit;padding:8px 0;border-bottom:1px solid var(--line)}
table{border-collapse:collapse;width:100%}
td{border-bottom:1px solid var(--line);padding:6px 4px;vertical-align:top}
details{margin:8px 0}
summary{cursor:pointer;color:var(--acc)}
.qty{font-weight:700;white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips a{padding:4px 10px;border:1px solid var(--line);border-radius:99px;text-decoration:none;font-size:.9em}
.seg a{font-size:1em;padding:6px 14px}
.chips a.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.md img{max-width:100%}.md pre{overflow-x:auto}.md table td,.md table th{border:1px solid var(--line);padding:4px 6px}
</style>
</head>
<body>
<nav><a href="/">Поиск</a><a href="/boxes">{{ t.boxes }}</a><a href="/items">{{ t.items }}</a><a href="/places">{{ t.places }}</a><a href="/projects">Проекты</a><a href="/history">История</a><a href="/phone">Телефон</a></nav>
<main><div id="drafts"></div>
<script>
// Card-form drafts (item_form.html) are kept until saved: offer the way back from any other page.
for (const k of Object.keys(localStorage)) if (k.startsWith("draft:") && k !== "draft:" + location.pathname) {
  const d = JSON.parse(localStorage[k]);
  if (d.sent && /^\/i\/\d+$/.test(location.pathname)) { localStorage.removeItem(k); continue; }  // a save lands on the card
  const c = document.createElement("div"), a = document.createElement("a");
  c.className = "card";
  c.append(`Несохранённый черновик «${d.name || "без названия"}» от ${when(d.t)} — `, a);
  a.href = d.url; a.textContent = "открыть";
  document.getElementById("drafts").append(c);
}
function when(t) { return new Date(t).toLocaleString("ru", {day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"}); }

// With the site open, a box label goes straight to its box (Web NFC, Chrome on Android; permission via /phone).
function nfcScan() {
  const r = new NDEFReader();
  r.onreading = e => {
    if (window.nfcBusy) return;  // the box page is writing this tag
    for (const rec of e.message.records) {
      const m = ["url", "absolute-url"].includes(rec.recordType) && new TextDecoder().decode(rec.data).match(/\/b\/(\w+)\/?$/i);
      if (m && location.pathname.toLowerCase() !== "/b/" + m[1].toLowerCase()) location.href = "/b/" + m[1];  // this origin: labels may name the host differently
    }
  };
  return r.scan();
}
if ("NDEFReader" in window) navigator.permissions.query({name: "nfc"})
  .then(p => p.state === "granted" && nfcScan().catch(() => addEventListener("click", nfcScan, {once: true}))).catch(() => {});
</script>
{% block main %}{% endblock %}</main>
</body>
</html>
