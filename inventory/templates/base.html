<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f6feb">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js")</script>
<title>{% block title %}{{ t.items }}{% endblock %}</title>
<style>
:root{--bar:77px;--bg:#f7f6f2;--fg:#1d1d1b;--mut:#6b6b66;--line:#e2e1dc;--card:#fff;--acc:#1a64d6;--on-acc:#fff;--bad:#c62828;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--fg:#ecebe6;--mut:#9a9993;--line:#34342f;--card:#1f1f1d;--acc:#58a6ff;--on-acc:#0d1117;--bad:#ef5350}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,sans-serif}
main{max-width:720px;margin:0 auto;padding:8px 16px calc(var(--bar) + 24px + env(safe-area-inset-bottom))}
a{color:var(--acc)}
h1{font-size:1.45rem;margin:.6em 0 .2em;text-wrap:balance}
h2{font-size:1.1rem;margin:1.3em 0 .4em;text-wrap:balance}
p{text-wrap:pretty}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.mut{color:var(--mut);font-size:.9em}
.crumbs{color:var(--mut);font-size:.9em}.crumbs a{display:inline-block;padding:10px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
.lrows{padding:0}.lrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:10px 14px;color:var(--fg);text-decoration:none}.lrow+.lrow{border-top:1px solid var(--line)}.lrow svg{flex:none;color:var(--mut)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.right{margin-left:auto}
input,select,textarea,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
input,select,textarea{width:100%}
input,select{min-height:44px}
.row input,.row select{width:auto;flex:1;min-width:0}.row>input,.row>select{min-width:6em}  /* a field squeezed by its buttons wraps them instead */
textarea{min-height:8em}
button,.btn{cursor:pointer;background:var(--acc);color:var(--on-acc);border:0;text-decoration:none;display:inline-block;min-height:44px;padding:10px 16px;border-radius:8px}
.btn{display:inline-flex;align-items:center;justify-content:center}
.ghost{background:transparent;color:var(--acc);border:1px solid var(--line)}
.bad{background:var(--bad)}
label{display:block;margin:14px 0 4px;font-weight:600}
.err{color:var(--bad)}
.sw{position:relative}.sw>form{position:absolute;inset:8px 0;display:flex;justify-content:flex-end}
.sw>form button{border-radius:12px}.sw>.card{position:relative;touch-action:pan-y}
.car{position:relative}
.car .strip{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:12px;background:var(--line)}
.car .strip::-webkit-scrollbar{display:none}
.car img{flex:0 0 100%;width:100%;height:60vh;object-fit:contain;scroll-snap-align:center}
.car .cnt{position:absolute;right:10px;bottom:10px;background:#000a;color:#fff;border-radius:10px;padding:2px 8px;font-size:.85em}
.car .x,.car .rot{display:none}
.car.full{position:fixed;inset:0;z-index:20;background:#000}
.car.full .strip{height:100%;border-radius:0;background:#000}
.car.full img{height:100dvh}
.car.full .x{display:block;position:absolute;top:10px;right:10px}
.car.full .rot{display:flex;gap:8px;position:absolute;top:10px;left:10px}
html:has(.car.full){overflow:hidden}
.pic{position:relative;display:inline-flex}
.pic button{position:absolute;top:-6px;right:-6px;min-height:0;padding:0 6px;border-radius:50%}
.thumb{width:52px;height:52px;object-fit:cover;border-radius:8px;flex:none;background:var(--line)}
a.line,.line{display:flex;gap:10px;align-items:center;text-decoration:none;color:inherit;padding:8px 0;border-bottom:1px solid var(--line)}
.line>a:not(.btn){display:flex;gap:10px;align-items:center;flex:1;min-width:0;color:inherit;text-decoration:none}
.line .grow{flex:1;min-width:0}.line form{margin:0}
.fbar{position:fixed;z-index:9;left:0;right:0;bottom:calc(var(--bar) + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);padding:8px 12px}
.fbar>div{max-width:720px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.fbar select,.fbar label,.fbar a{flex:none;width:auto;margin:0;min-height:44px;border-radius:99px;font-weight:400;border:1px solid var(--line);background:var(--bg);color:inherit;padding:0 14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none;font-size:.9em}
.fbar select{max-width:11em;text-overflow:ellipsis}
.fbar .on{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.fbar label input{position:absolute;opacity:0;width:1px;height:1px}
.fbar label:has(:focus-visible){outline:2px solid var(--acc);outline-offset:2px}
body:has(.fbar) main{padding-bottom:calc(var(--bar) + 84px + env(safe-area-inset-bottom))}
table{border-collapse:collapse;width:100%}
td{border-bottom:1px solid var(--line);padding:8px 4px;vertical-align:top;font-variant-numeric:tabular-nums}
td a{color:inherit;text-decoration:none;font-weight:600}  /* a row of names, not a wall of blue: bold says «tap me» */
details{margin:8px 0}
summary{cursor:pointer;color:var(--acc)}
.qty{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips a{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:99px;text-decoration:none;font-size:.9em}
.seg a{font-size:1em}
.chips a.on{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.md img{max-width:100%}.md pre{overflow-x:auto}.md table td,.md table th{border:1px solid var(--line);padding:4px 6px}
[hidden]{display:none!important}[data-qr]{display:none}.qr [data-qr]{display:inline-block}
label.chk{display:flex;gap:10px;align-items:center;min-height:44px;font-weight:400}.chk input{flex:none;width:auto}
input[type=checkbox],input[type=radio]{width:20px;height:20px;min-height:0;padding:0;margin:0;accent-color:var(--acc)}
.stock{display:grid;grid-template-columns:5em 1fr;gap:8px;margin-top:8px}
.acts{display:flex;flex-direction:column;gap:4px;justify-content:space-between}
.num{display:flex;gap:4px}.num input{text-align:center;min-width:3em}.num button{padding:6px 12px}
.row .num{flex:0 0 auto}.row .num input{flex:0 0 4em}
.stock .num{flex-direction:column-reverse}.stock .num input{font-size:1.2em;padding:6px 2px}.stock .num button{padding:4px 0}
.stock select{grid-column:1/-1}
.mini{padding:6px 9px;font-size:.85em}.mini.on{background:var(--acc);color:var(--on-acc)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg)}dialog::backdrop{background:#0008}
dialog video{width:min(80vw,480px);display:block;margin-bottom:8px}
/* №54 the bar: at the thumb, the reach grows left to right; the screen's own action rides above it (.save, .act) */
.bar{position:fixed;z-index:10;left:0;right:0;bottom:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
.bar>div{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:8px}.bar form{flex:1;min-width:0}
.tab{flex:none;width:48px;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:10px;color:var(--mut);font-size:12px;text-decoration:none}
.tab.on{color:var(--acc);font-weight:600}
.pill{display:flex;align-items:center;gap:6px;height:48px;margin:0;padding:0 12px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--mut);font-weight:400;cursor:text}
.pill input{flex:1;min-width:0;min-height:0;height:100%;border:0;padding:0;background:none;outline:none;font-size:16px;color:var(--fg)}
.pill input::placeholder{color:var(--mut)}
.pill.on{border:2px solid var(--acc);color:var(--fg)}.pill:focus-within{border:2px solid var(--acc)}
.rnd{flex:none;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--fg);display:grid;place-items:center}
.fab{flex:none;width:60px;height:60px;min-height:0;border-radius:50%;padding:0;display:grid;place-items:center}
body:has(main :is(input:not([type=checkbox],[type=radio],[type=file]),textarea):focus){--bar:0px}  /* the keyboard is up: the page's own field wins the space */
body:has(main :is(input:not([type=checkbox],[type=radio],[type=file]),textarea):focus) .bar{display:none}
@media print{.bar,.fbar{display:none}}
.pick{position:relative;display:flex;width:100%}.row .pick{flex:1;width:auto;min-width:0}.stock .pick{grid-column:1/-1}
.pick input{flex:1;min-width:0;padding-right:2.4em}
.pick select{position:absolute;inset:0;opacity:0;pointer-events:none}
.pick>button{position:absolute;right:1px;top:1px;bottom:1px;min-height:0;background:none;color:var(--mut);padding:0 12px}
.pickl,.pickall{display:flex;flex-direction:column}
.pickl{flex-basis:100%;grid-column:1/-1;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.pickl button,.pickall button,.pickm>.pmore{background:none;color:inherit;text-align:left;border-radius:0;padding:11px 12px;border-top:1px solid var(--line)}
.pickl button:first-child{border-top:0}.pickl .pmore,.pickm .pmore{color:var(--acc)}.pickm>.pmore{display:block;width:100%}.pickl>div{padding:11px 12px}
.pickm{padding:0;margin:12px auto auto;width:min(92vw,480px);border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg)}
.pickm::backdrop{background:#0008}.pickm>div{display:flex;gap:8px;padding:8px}.pickm input{flex:1;min-width:0}
.pickall{max-height:70vh;overflow-y:auto}
form[data-sent] button{opacity:.5}
/* settings.html: a row per setting, radios as a segmented choice, switches, the save bar */
.choice{flex:none;display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)} .choice label{margin:0;min-width:44px;height:44px;display:grid;place-items:center;padding:0 12px;font-weight:400} .choice input{position:absolute;opacity:0} .choice label:has(:checked){background:var(--acc);color:var(--on-acc);font-weight:600} .choice label:has(:focus-visible){outline:2px solid var(--acc);outline-offset:-2px}
.src{display:inline-block;font-size:12px;font-weight:600;line-height:20px;padding:0 8px;border-radius:99px;border:1px solid var(--line);color:var(--mut);white-space:nowrap} .src.warn{border-color:var(--bad);color:var(--bad)} .src.ch{border-color:var(--acc);color:var(--acc)}
.card.list{padding:0}
.set{padding:10px 16px;border-bottom:1px solid var(--line)} .set:last-child{border-bottom:0}
.seth{display:flex;align-items:center;gap:8px;min-height:28px} .seth .nm{flex:1;min-width:0;margin:0;font-weight:600}
.setc{display:flex;align-items:center;gap:12px;margin-top:6px}
.sm{font-size:13px}
.gh{margin:22px 0 4px}
.code{display:flex;align-items:flex-start;gap:4px;padding:6px 2px 6px 12px;margin-top:6px;background:var(--bg);border:1px solid var(--line);border-radius:8px} .code pre{flex:1;min-width:0;margin:0;font:13px/1.5 ui-monospace,monospace;white-space:pre-wrap;word-break:break-all}
.warn{display:flex;gap:8px;align-items:flex-start;margin:0;font-size:13px}
.save{position:fixed;z-index:10;left:0;right:0;bottom:calc(var(--bar) + env(safe-area-inset-bottom));display:flex;justify-content:flex-end;align-items:center;gap:12px;padding:10px 12px;background:var(--card);border-top:1px solid var(--line)}
input[type=checkbox].tgl{appearance:none;flex:none;width:52px;height:32px;margin:0;border-radius:99px;background:var(--line);position:relative;cursor:pointer} .tgl::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .15s} .tgl:checked{background:var(--acc)} .tgl:checked::after{transform:translateX(20px)}
body:has(.save:not([hidden])) main{padding-bottom:calc(var(--bar) + 88px + env(safe-area-inset-bottom))}
</style>

<body>
<main><div id="drafts"></div>
<script>
// Card-form drafts (item_form.html) are kept until saved: offer the way back from any other page.
for (const k of Object.keys(localStorage)) if (k.startsWith("draft:") && k !== "draft:" + location.pathname) {
  const d = JSON.parse(localStorage[k]);
  if (d.sent) { localStorage.removeItem(k); continue; }  // saved: it landed on the card or the box; a failed save stays on its form
  const c = document.createElement("div"), a = document.createElement("a");
  c.className = "card";
  c.append(`Несохранённый черновик «${d.name || "без названия"}» от ${when(d.t)} — `, a);
  a.href = d.url; a.textContent = "открыть";
  document.getElementById("drafts").append(c);
}
function when(t) { return new Date(t).toLocaleString("ru", {day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"}); }

// With the site open, a box label goes straight to its box (Web NFC, Chrome on Android; permission via /settings).
// On a page with a visible box field (_box.html) it fills the field instead; on an item card it puts the item there.
// Settings «Сканирование»: NFC or QR switched off leaves the interface (the QR printed on a label stays).
const SCAN = {nfc: {{ core.SCAN_NFC|tojson }}, qr: {{ core.SCAN_QR|tojson }}, def: {{ core.SCAN_DEFAULT|tojson }}};
document.documentElement.classList.toggle("qr", SCAN.qr && "BarcodeDetector" in window && !!navigator.mediaDevices);
let armed = null, scanning = null;  // armed: the field whose QR button was pressed
const BOX = /\/b\/([A-Za-z0-9]+)\/?$/i, ITEM = /\/i\/(\d+)\/?$/i;  // a label's or a tag's URL, any host
const boxField = () => armed || [...document.querySelectorAll("[data-box]")]
  .find(e => e.checkVisibility ? e.checkVisibility() : e.offsetParent) || document.querySelector("form[data-put] [data-box]");
async function gotBox(id) {
  if (location.pathname.toLowerCase() === "/b/" + id.toLowerCase()) return;  // this box's own label: already here
  const f = boxField();
  if (!f) return location.href = "/b/" + id;  // this origin: labels may name the host differently
  const o = [...document.querySelectorAll("#boxlist option")].find(o => o.value === id || o.value.endsWith(` (${id})`)), label = o ? o.value : id;
  const put = f.form?.hasAttribute("data-put"), from = put && f.form.dataset.from;  // the item card; from: the one box it lies in
  const asked = f === armed; armed = null; document.querySelectorAll(".mini.on").forEach(b => b.classList.remove("on"));
  if (from === id || f.value === label && !put) return;  // already there
  // empty, being typed in or asked for by its button: fill; lying in another box or a box already chosen: ask first
  if (!(put ? !from : asked || !f.value || f === document.activeElement) && !await askMove(label, put)) return;
  f.value = label; f.dispatchEvent(new Event("input", {bubbles: true})); f.dispatchEvent(new Event("change", {bubbles: true}));
  if (from) { f.form.elements.kind.value = "move"; f.form.elements.src.value = from; }
  if (put) f.form.requestSubmit();
}
function askMove(label, card) {  // «больше не спрашивать» is for a thing's card only (№30)
  return ask(`Переложить в ${label}?`, "Переложить", card && "askMove");
}
function ask(text, yes, key) {  // key: «больше не спрашивать» offered, kept on this phone under it; /settings turns it back on
  try { if (key && localStorage[key] === "no") return true; } catch {}
  const d = document.createElement("dialog");
  d.innerHTML = `<form method="dialog"><p></p>${key ? `<label class="chk"><input type="checkbox"> больше не спрашивать</label>` : ""}
    <p class="row"><button value="y"></button><button value="" class="ghost">Отмена</button></p></form>`;
  d.querySelector("p").textContent = text; d.querySelector("[value=y]").textContent = yes;
  document.body.append(d); d.showModal();
  return new Promise(done => d.onclose = () => {
    const ok = d.returnValue === "y";
    if (ok && d.querySelector("input")?.checked) try { localStorage[key] = "no"; } catch {}
    d.remove(); done(ok);
  });
}
function nfcScan() {  // one reader per page: two would both fire and the second would miss the armed field
  return scanning ||= (() => { const r = new NDEFReader();
    r.onreading = e => {
      if (window.nfcBusy || document.querySelector("dialog[open]:not([data-nfc])")) return;  // this page is writing the tag; a question is open
      document.querySelector("dialog[data-nfc]")?.close();  // the corner button's «поднесите метку» got its tag
      for (const rec of e.message.records) {
        const u = ["url", "absolute-url"].includes(rec.recordType) ? new TextDecoder().decode(rec.data) : "";
        const b = u.match(BOX), i = u.match(ITEM);
        if (b) return gotBox(b[1].toUpperCase());
        if (i) return location.href = "/I/" + i[1];  // a thing's tag: its card as scanned (№37, №43)
      }
    };
    return r.scan(); })().catch(e => { scanning = null; throw e; });
}
function fab() {  // the corner button: NFC where the phone reads tags (unless the settings say QR first), else the QR camera
  if (!(SCAN.nfc && "NDEFReader" in window && (SCAN.def !== "qr" || !SCAN.qr))) return qrScan();
  const d = document.createElement("dialog"), p = document.createElement("p"), r = document.createElement("p");
  d.dataset.nfc = ""; p.textContent = "Поднесите телефон к метке"; r.className = "row";
  if (SCAN.qr) { const q = document.createElement("button"); q.type = "button"; q.className = "ghost"; q.textContent = "Сканировать QR";
    q.onclick = () => { d.close(); qrScan(); }; r.append(q); }
  const x = document.createElement("button"); x.type = "button"; x.className = "ghost"; x.textContent = "Закрыть"; x.onclick = () => d.close();
  r.append(x); d.onclose = () => d.remove(); d.append(p, r); document.body.append(d); d.showModal();
  nfcScan().catch(e => p.textContent = "NFC не включился: " + e.message);
}
async function qrScan(f) {  // f: the box field whose QR button was pressed; none: the corner button, it opens what it reads
  if (!("BarcodeDetector" in window && navigator.mediaDevices)) {
    if (await ask(`Этот браузер не читает QR с сайта. Наведите на наклейку камеру телефона — страница откроется сама. `
      + `Сканер на сайте работает в Chrome на Android, когда адрес ${location.origin} добавлен в исключения Chrome.`, "Как настроить")) location.href = "/settings#phone";
    return;
  }
  const d = document.createElement("dialog"), p = document.createElement("p"), v = document.createElement("video"), x = document.createElement("button");
  let s;
  p.textContent = f ? "Наведите на QR коробки" : "Наведите на QR наклейки";
  v.playsInline = v.muted = true;
  x.type = "button"; x.className = "ghost"; x.textContent = "Закрыть"; x.onclick = () => d.close();
  d.onclose = () => { s?.getTracks().forEach(t => t.stop()); d.remove(); };
  d.append(p, v, x); document.body.append(d); d.showModal();
  try {
    s = await navigator.mediaDevices.getUserMedia({video: {facingMode: "environment"}});
    if (!d.open) return s.getTracks().forEach(t => t.stop());
    v.srcObject = s; await v.play();
    const det = new BarcodeDetector({formats: ["qr_code"]});
    while (d.open) {
      const codes = (await det.detect(v).catch(() => [])).map(c => c.rawValue);
      const u = codes.find(u => BOX.test(u) || !f && ITEM.test(u));  // a field takes boxes only: a thing's label would leave the form
      if (u) {
        d.close();
        const b = u.match(BOX)?.[1].toUpperCase(), i = u.match(ITEM)?.[1];
        if (f) { armed = f; return gotBox(b); }  // a label read: straight into the field, no questions
        if (i) return location.href = "/I/" + i;  // a thing: its card as scanned, «Взять?» (№37, №43)
        if (location.pathname.toLowerCase() !== "/b/" + b.toLowerCase()) location.href = "/b/" + b;
        return;
      }
      if (codes.length) p.textContent = "Это не наша наклейка";
      await new Promise(r => setTimeout(r, 200));
    }
  } catch (e) { d.close(); alert("Камера недоступна: " + e.message); }
}
addEventListener("click", e => {
  if (e.target.closest("#scan")) return fab();
  const b = e.target.closest("[data-qr]");
  if (!b) return;
  armed = b.parentElement.querySelector("[data-box]"); b.classList.add("on");
  qrScan(armed).finally(() => b.classList.remove("on"));
});
addEventListener("click", async e => {  // «Записать на метку» (_box.html nfc_tag): Chrome on Android, site trusted as secure, see /settings
  const b = e.target.closest("[data-nfcw]");
  if (!b) return;
  const st = b.parentElement.nextElementSibling;
  if (!("NDEFReader" in window)) {  // say why, not nothing: most often the site is open under another address
    st.innerHTML = `Этот браузер не пишет метки. Нужен Chrome на Android, и адрес <b>${location.origin}</b> должен стоять в исключениях Chrome, <a href="/settings#phone">как здесь</a>.`;
    return;
  }
  st.textContent = "Поднесите метку к задней крышке телефона…";
  window.nfcBusy = true;  // the scan would jump to whatever the tag held before
  try {
    await new NDEFReader().write({records: [{recordType: "url", data: b.dataset.nfcw}]});
    st.textContent = "Записано ✓ Проверьте: коснитесь метки телефоном.";
    const i = b.dataset.nfcw.match(/\/I\/(\d+)$/), s = document.getElementById("single");  // №43: a thing with a tag is one of a kind
    if (i && (await fetch(`/i/${i[1]}/tag`, {method: "POST"})).ok && s && "auto" in s.dataset) s.checked = true;
  } catch (e) { st.textContent = e.name == "NotAllowedError" ? "Нажмите «Записать на метку» — телефон ждёт нажатия." : "Не записалось: " + e.message; }
  finally { window.nfcBusy = false; }
});
addEventListener("click", e => {  // «Скопировать» (nfc_tag), for NFC Tools: navigator.clipboard needs https, this is http
  const b = e.target.closest("[data-copy]");
  if (!b) return;
  b.parentElement.previousElementSibling.select(); document.execCommand("copy"); b.textContent = "Скопировано ✓";
});
addEventListener("DOMContentLoaded", async () => {  // №43: a thing's tag scanned (/I/N → ?scan=1): take it out of its box
  const f = new URLSearchParams(location.search).has("scan") && document.querySelector("form[data-take]");
  if (!f) return;
  history.replaceState(null, "", location.pathname);  // a reload doesn't ask again
  if (await ask(`Взять «${f.dataset.name}»?`, "Взять", "askTake")) f.submit();
});
addEventListener("DOMContentLoaded", () => {  // №42: «Сохранить и записать метку» lands on the card with ?nfc=1
  const b = new URLSearchParams(location.search).has("nfc") && document.querySelector("[data-nfcw]");
  if (!b) return;
  history.replaceState(null, "", location.pathname);  // a reload doesn't write again
  (b.closest("details") || {}).open = true; b.scrollIntoView({block: "center"}); b.click();
});
if (SCAN.nfc && "NDEFReader" in window) navigator.permissions.query({name: "nfc"})
  .then(p => p.state === "granted" && nfcScan().catch(() => addEventListener("click", nfcScan, {once: true}))).catch(() => {});
if (!SCAN.qr && !("NDEFReader" in window)) document.getElementById("scan")?.remove();  // nothing left for the corner button here

// Our own list over a choice (select[data-pick], a long select, a datalist field): the native datalist won't open on an
// Android tap and filters by the value already in it. Open: the value hides, the field searches; recent choices first,
// «Выбрать…» opens them all. Leaving without a choice puts the old value back. The real field changes only on a choice.
let pk = null;  // the open picker: its .pick span
const pickOpts = s => {
  const f = s.f, o = f.tagName == "SELECT" ? [...f.options].map(o => ({v: o.value, t: o.text})) : [...s.dl.options].filter(o => !o.hidden).map(o => ({v: o.value, t: o.value, w: o.dataset.where}));
  return f.tagName == "SELECT" || f.required || o.some(o => !o.v) ? o : [{v: "", t: "—"}, ...o];
};
const pickRecent = f => { try { return JSON.parse(localStorage["recent:" + f.dataset.pk] || "[]"); } catch { return []; } };
function pickBtn(o, fn) {
  const b = document.createElement("button"), m = o.t === o.v && o.t.match(/^(.*) (\([A-Z0-9]+\))$/);  // a box: its ID grey
  b.type = "button"; b.onclick = fn;
  if (m) b.append(m[1] + " ", Object.assign(document.createElement("span"), {className: "mut", textContent: m[2]}));
  else b.textContent = o.t;
  if (o.w) b.append(Object.assign(document.createElement("span"), {className: "mut", textContent: " · " + o.w}));  // its place: shelves share names across cabinets
  return b;
}
function pickFill(s, q) {
  const all = pickOpts(s), empty = all.find(o => !o.v), r = pickRecent(s.f);
  let l = all.filter(o => o.v);
  if (q) l = l.filter(o => (o.t + " " + (o.w || "")).toLowerCase().includes(q.toLowerCase()));  // «шкаф» finds its shelves
  else if (l.length > 6) l = [...r.map(v => l.find(o => o.v === v)).filter(Boolean), ...l.filter(o => !r.includes(o.v))];
  s.list.replaceChildren(...(!q && empty ? [empty] : []).concat(l.slice(0, 6)).map(o => pickBtn(o, () => pickSet(s, o.v))));
  if (l.length > 6) s.list.append(Object.assign(pickBtn({t: "Выбрать…"}, () => pickAll(s, q)), {className: "pmore"}));
  if (!l.length) s.list.append(Object.assign(document.createElement("div"), {className: "mut", textContent: "не нашлось"}));
  if (s.f.dataset.new) s.list.append(pickNew(s, () => q));
}
// №19: «+ Коробка» under a field with data-new: that page makes one and comes back with it (pickMade). data-act: a new box
// page saves itself before leaving, so the way back is to its own address.
function pickNew(s, q) {
  const b = pickBtn({t: "+ " + s.f.dataset.term}, () => location.assign(s.f.dataset.new + "?" +
    new URLSearchParams({from: location.pathname + location.search, field: s.f.name, name: q()})));
  b.className = "pmore"; b.setAttribute("data-act", ""); return b;
}
// The page it opens: a form, make() → the new id or null (the page says why), made() → the id if it exists already.
// Back (the page's «Назад» or the phone's): nothing typed → just back; typed → «Сохранить?»: yes puts it in the field.
// The phone's Back is caught by one extra history step once something is typed; pkd counts our steps to jump over them.
function pickMade(f, make, made = () => null) {
  const u = new URLSearchParams(location.search), at = u.get("from"), field = u.get("field");
  if (!at) return;
  const vals = () => JSON.stringify([...new FormData(f)].map(([k, v]) => [k, v.name ?? v])), blank = vals();
  if (!history.state) history.replaceState({pkd: 0}, "");
  let guard = false;
  const push = () => { history.pushState({pkd: history.state.pkd + 1}, ""); guard = true; };
  const back = id => {
    if (id) sessionStorage.picked = JSON.stringify({at, field, id: String(id)});
    history.go(-1 - history.state.pkd);
  };
  const ask = async () => {
    if (made()) return back(made());
    if (vals() == blank || !confirm("Сохранить? «Отмена» — выйти без сохранения.")) return back();
    const id = await make();
    id ? back(id) : guard || push();
  };
  f.addEventListener("input", () => guard || vals() == blank || push());
  addEventListener("popstate", () => { if (guard) { guard = false; ask(); } });
  for (const b of f.querySelectorAll("[data-back]")) b.onclick = ask;
  f.addEventListener("submit", async e => {
    e.preventDefault(); e.stopImmediatePropagation();
    const id = await make();
    if (id) back(id);
  }, true);
}
function pickOpen(s) {
  pickClose(true);
  pk = s; s.old = s.vis.value; s.vis.value = ""; s.vis.placeholder = "поиск…"; s.b.textContent = "✕";
  s.list = document.createElement("div"); s.list.className = "pickl";
  s.parentElement.matches(".row,.stock") ? s.parentElement.append(s.list) : s.after(s.list);  // a row keeps its buttons on one line
  pickFill(s, "");
}
function pickClose(back) {
  const s = pk;
  if (!s) return;
  pk = null;
  if (back) s.vis.value = s.old;
  s.vis.placeholder = s.ph; s.b.textContent = "▾"; s.list.remove();
  if (document.activeElement === s.vis) s.vis.blur();
  document.querySelector("dialog.pickm")?.close();
}
function pickSet(s, v) {
  pickClose(false);
  s.f.value = v;
  if (s.vis !== s.f) s.vis.value = s.f.selectedOptions[0]?.text ?? "";
  s.f.dispatchEvent(new Event("input", {bubbles: true})); s.f.dispatchEvent(new Event("change", {bubbles: true}));
}
function pickAll(s, q) {  // all of them, with search
  const d = document.createElement("dialog"), top = document.createElement("div"), i = document.createElement("input"), x = document.createElement("button"), l = document.createElement("div");
  d.className = "pickm"; l.className = "pickall"; i.placeholder = "поиск…"; i.autocomplete = "off"; i.value = q;
  x.type = "button"; x.className = "ghost"; x.textContent = "✕"; x.autofocus = true; x.onclick = () => pickClose(true);
  l.append(...pickOpts(s).map(o => pickBtn(o, () => pickSet(s, o.v))));
  i.oninput = () => { const q = i.value.toLowerCase(); for (const b of l.children) b.hidden = !!q && !b.textContent.toLowerCase().includes(q); };
  i.oninput();
  d.onclick = e => e.target === d && pickClose(true);  // the backdrop
  d.onclose = () => { d.remove(); if (pk === s) pickClose(true); };  // the phone's Back
  top.append(i, x); d.append(top, ...s.f.dataset.new ? [pickNew(s, () => i.value)] : [], l); document.body.append(d);
  document.activeElement?.blur();  // else closing it focuses the field again, and that opens the list
  d.showModal();
}
addEventListener("DOMContentLoaded", () => {
  const sel = [...document.querySelectorAll("select")].filter(f => f.hasAttribute("data-pick") || f.options.length > 7 && !f.querySelector("optgroup") && !f.closest(".fbar"));
  for (const f of [...document.querySelectorAll("input[list]"), ...sel]) {
    const s = document.createElement("span");
    s.className = "pick"; s.f = f; s.b = document.createElement("button"); s.b.type = "button"; s.b.textContent = "▾";
    f.before(s);
    if (f.tagName == "SELECT") {  // stays in the form, unseen: its value is what gets sent, `required` still works
      s.vis = document.createElement("input"); s.vis.autocomplete = "off"; s.vis.value = f.selectedOptions[0]?.text ?? "";
      f.tabIndex = -1; f.dataset.pk = f.name; s.append(s.vis, f, s.b);
    } else { s.vis = f; s.dl = f.list; f.dataset.pk = f.getAttribute("list"); f.removeAttribute("list"); s.append(f, s.b); }
    s.ph = s.vis.placeholder;
  }
  let got = null;  // №19: back from a «+» page (pickMade) with what it made
  try { got = JSON.parse(sessionStorage.picked || "null"); sessionStorage.removeItem("picked"); } catch {}
  const s = got?.at == location.pathname + location.search && [...document.querySelectorAll(".pick")].find(s => s.f.name == got.field);
  if (s) pickSet(s, s.dl ? [...s.dl.options].map(o => o.value).find(v => v == got.id || v.endsWith(` (${got.id})`)) ?? got.id : got.id);
});
addEventListener("focusin", e => { const s = e.target.closest?.(".pick"); if (s && e.target === s.vis && pk !== s) pickOpen(s); });
addEventListener("click", e => {
  const b = e.target.closest?.(".pick>button");
  if (b) pk === b.parentElement ? pickClose(true) : pickOpen(b.parentElement);
  else if (pk && !e.target.closest?.(".pick,.pickl,.pickm")) pickClose(true);
}, true);
addEventListener("keydown", e => {
  if (!pk || !e.target.closest?.(".pick")) return;
  if (e.key == "Escape") pickClose(true);
  if (e.key != "Enter") return;
  e.preventDefault();  // not the form's submit: Enter takes the first match
  const b = pk.vis.value && pk.list.querySelector("button:not(.pmore)");
  b ? b.click() : pickClose(true);
});
// A person typing in a picker is searching: the form (autosave, drafts) must not see it. Our own events pass.
addEventListener("input", e => {
  const s = e.target.closest?.(".pick");
  if (!s || !e.isTrusted) return;
  e.stopImmediatePropagation();
  if (pk === s) pickFill(s, s.vis.value.trim());
}, true);
addEventListener("change", e => {
  const s = e.target.closest?.(".pick");
  if (!s) return;
  if (e.isTrusted) return e.stopImmediatePropagation();
  if (pk === s) pickClose(false);  // a scanned label filled the open field
  const f = s.f;
  if (f.value) try { localStorage["recent:" + f.dataset.pk] = JSON.stringify([f.value, ...pickRecent(f).filter(v => v !== f.value)].slice(0, 6)); } catch {}
}, true);
addEventListener("pagehide", () => pickClose(true));  // before a page's own pagehide saves the form
// A second tap while photos upload sent a whole second card (№32): a posted form goes once until the page is back.
document.addEventListener("submit", e => {
  const f = e.target;
  if (e.defaultPrevented || f.method != "post") return;  // fetch-saved forms (box page) send as often as they like
  if (f.dataset.sent) return e.preventDefault();
  f.dataset.sent = 1;
});
// №27: a card with data-swipe slides left over the «Удалить» form under it; let go past 20% of its width and
// that form asks and sends. Short of it, the card slides back.
document.addEventListener("pointerdown", e => {
  const card = e.target.closest?.("[data-swipe]");
  if (!card || e.button || e.target.closest("input,textarea,select")) return;
  const x0 = e.clientX, form = card.previousElementSibling;
  let dx = 0;
  const move = e => { dx = Math.min(0, e.clientX - x0); card.style.transform = `translateX(${dx}px)`; };
  const up = () => {
    removeEventListener("pointermove", move); removeEventListener("pointerup", up); removeEventListener("pointercancel", up);
    if (-dx > card.offsetWidth * .2) form.requestSubmit();
    card.style.transition = "transform .2s"; card.style.transform = "";
    setTimeout(() => card.style.transition = "", 200);
    if (dx > -10) return;
    const eat = e => e.preventDefault();  // a slide is not a tap on the link it started on
    card.addEventListener("click", eat, true); setTimeout(() => card.removeEventListener("click", eat, true), 300);
  };
  addEventListener("pointermove", move); addEventListener("pointerup", up); addEventListener("pointercancel", up);
});
addEventListener("pageshow", e => { if (e.persisted) location.reload(); });  // back button: the page from memory has old counts
// №40: every number field gets − and + by its step (none: one). Card numbers are text ("1,5"), so no stepUp; never below min (else 0).
// An empty field: + starts it, − leaves it empty («не считал»). Events as if typed: drafts and autosave see it.
addEventListener("DOMContentLoaded", () => {
  for (const f of document.querySelectorAll("input[type=number], input[inputmode=decimal]")) {
    const s = document.createElement("span"), btn = (t, d) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "ghost"; b.textContent = t;
      b.onclick = () => {
        const st = +f.step || 1, min = f.min === "" ? 0 : +f.min, max = f.max === "" ? Infinity : +f.max, v = parseFloat(f.value.replace(",", "."));
        if (isNaN(v) && d < 0) return;
        const n = isNaN(v) ? Math.max(min, st) : Math.min(max, Math.max(min, Math.round((v + d * st) * 1000) / 1000));
        f.value = f.value.includes(",") ? String(n).replace(".", ",") : n;
        for (const e of ["input", "change"]) f.dispatchEvent(new Event(e, {bubbles: true}));
      };
      return b;
    };
    s.className = "num"; f.before(s); s.append(btn("−", -1), f, btn("+", 1));
  }
});
</script>
