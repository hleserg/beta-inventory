<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f6feb">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js")</script>
<title>{% block title %}{{ t.items }}{% endblock %}</title>
<style>
:root{--bg:#f7f6f2;--fg:#1d1d1b;--mut:#6b6b66;--line:#e2e1dc;--card:#fff;--acc:#1f6feb;--bad:#c62828}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--fg:#ecebe6;--mut:#9a9993;--line:#34342f;--card:#1f1f1d;--acc:#58a6ff;--bad:#ef5350}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,sans-serif}
main{max-width:720px;margin:0 auto;padding:8px 16px 64px}
nav{display:flex;gap:2px;overflow-x:auto;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--card)}
nav a{padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--fg);white-space:nowrap}
nav a:hover{background:var(--line)}
a{color:var(--acc)}
h1{font-size:1.45rem;margin:.6em 0 .2em}
h2{font-size:1.1rem;margin:1.3em 0 .4em}
.mut{color:var(--mut);font-size:.9em}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.right{margin-left:auto}
input,select,textarea,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
input,select,textarea{width:100%}
.row input,.row select{width:auto;flex:1;min-width:0}
.row input[type=number]{flex:0 0 5.5em}
textarea{min-height:8em}
button,.btn{cursor:pointer;background:var(--acc);color:#fff;border:0;text-decoration:none;display:inline-block;padding:9px 14px;border-radius:8px}
.ghost{background:transparent;color:var(--acc);border:1px solid var(--line)}
.bad{background:var(--bad)}
label{display:block;margin:14px 0 4px;font-weight:600}
.err{color:var(--bad)}
.car{position:relative}
.car .strip{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:12px;background:var(--line)}
.car .strip::-webkit-scrollbar{display:none}
.car img{flex:0 0 100%;width:100%;height:60vh;object-fit:contain;scroll-snap-align:center}
.car .cnt{position:absolute;right:10px;bottom:10px;background:#000a;color:#fff;border-radius:10px;padding:2px 8px;font-size:.85em}
.car .x{display:none}
.car.full{position:fixed;inset:0;z-index:20;background:#000}
.car.full .strip{height:100%;border-radius:0;background:#000}
.car.full img{height:100dvh}
.car.full .x{display:block;position:absolute;top:10px;right:10px}
html:has(.car.full){overflow:hidden}
.pic{position:relative;display:inline-flex}
.pic button{position:absolute;top:-6px;right:-6px;padding:0 6px;border-radius:50%}
.thumb{width:52px;height:52px;object-fit:cover;border-radius:8px;flex:none;background:var(--line)}
a.line{display:flex;gap:10px;align-items:center;text-decoration:none;color:inherit;padding:8px 0;border-bottom:1px solid var(--line)}
table{border-collapse:collapse;width:100%}
td{border-bottom:1px solid var(--line);padding:6px 4px;vertical-align:top}
details{margin:8px 0}
summary{cursor:pointer;color:var(--acc)}
.qty{font-weight:700;white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips a{padding:4px 10px;border:1px solid var(--line);border-radius:99px;text-decoration:none;font-size:.9em}
.seg a{font-size:1em;padding:6px 14px}
.chips a.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.md img{max-width:100%}.md pre{overflow-x:auto}.md table td,.md table th{border:1px solid var(--line);padding:4px 6px}
[hidden]{display:none!important}[data-nfc],[data-qr]{display:none}.nfc [data-nfc],.qr [data-qr]{display:inline-block}
.stock{display:grid;grid-template-columns:5em 1fr;gap:8px;margin-top:8px}
.spin,.acts{display:flex;flex-direction:column;gap:4px}.acts{justify-content:space-between}
.spin input{text-align:center;font-size:1.2em;padding:6px 2px}.spin button{padding:4px 0}
.stock select{grid-column:1/-1}
.mini{padding:6px 9px;font-size:.85em}.mini.on{background:var(--acc);color:#fff}
dialog video{width:min(80vw,480px);display:block;margin-bottom:8px}
</style>
</head>
<body>
<nav><a href="/">Поиск</a><a href="/boxes">{{ t.boxes }}</a><a href="/items">{{ t.items }}</a><a href="/places">{{ t.places }}</a><a href="/projects">Проекты</a><a href="/history">История</a><a href="/phone">Телефон</a></nav>
<main><div id="drafts"></div>
<script>
// Card-form drafts (item_form.html) are kept until saved: offer the way back from any other page.
for (const k of Object.keys(localStorage)) if (k.startsWith("draft:") && k !== "draft:" + location.pathname) {
  const d = JSON.parse(localStorage[k]);
  if (d.sent) { localStorage.removeItem(k); continue; }  // saved: it landed on the card or the box; a failed save stays on its form
  const c = document.createElement("div"), a = document.createElement("a");
  c.className = "card";
  c.append(`Несохранённый черновик «${d.name || "без названия"}» от ${when(d.t)} — `, a);
  a.href = d.url; a.textContent = "открыть";
  document.getElementById("drafts").append(c);
}
function when(t) { return new Date(t).toLocaleString("ru", {day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"}); }

// With the site open, a box label goes straight to its box (Web NFC, Chrome on Android; permission via /phone).
// On a page with a box field (_box.html) it fills the field instead.
document.documentElement.classList.toggle("nfc", "NDEFReader" in window);
document.documentElement.classList.toggle("qr", "BarcodeDetector" in window && !!navigator.mediaDevices);
let armed = null, scanning = null;  // armed: the field whose NFC/QR button was pressed
const boxField = () => armed || [...document.querySelectorAll("[data-box]:not([data-box=armed])")]
  .find(e => e.checkVisibility ? e.checkVisibility() : e.offsetParent) || document.querySelector("form[data-put] [data-box]");
function gotBox(id) {
  const f = boxField();
  if (!f) { if (location.pathname.toLowerCase() !== "/b/" + id.toLowerCase()) location.href = "/b/" + id; return; }  // this origin: labels may name the host differently
  const o = [...document.querySelectorAll("#boxlist option")].find(o => o.value === id || o.value.endsWith(` (${id})`)), label = o ? o.value : id;
  const put = f.form?.hasAttribute("data-put");  // the item card: a scanned box is where the item goes, no button
  // empty, being typed in or asked for by its button: fill; a box already chosen: ask first
  if (f.value !== label && (put || f === armed || !f.value || f === document.activeElement || confirm(`Изменить коробку на ${label}?`))) {
    f.value = label; f.dispatchEvent(new Event("input", {bubbles: true})); f.dispatchEvent(new Event("change", {bubbles: true}));
  }
  armed = null; document.querySelectorAll(".mini.on").forEach(b => b.classList.remove("on"));
  if (put) f.form.requestSubmit();
}
function nfcScan() {  // one reader per page: two would both fire and the second would miss the armed field
  return scanning ||= (() => { const r = new NDEFReader();
    r.onreading = e => {
      if (window.nfcBusy) return;  // the box page is writing this tag
      for (const rec of e.message.records) {
        const m = ["url", "absolute-url"].includes(rec.recordType) && new TextDecoder().decode(rec.data).match(/\/b\/([A-Za-z0-9]+)\/?$/i);
        if (m) return gotBox(m[1].toUpperCase());
      }
    };
    return r.scan(); })().catch(e => { scanning = null; throw e; });
}
async function qrScan() {
  const f = armed, d = document.createElement("dialog"), v = document.createElement("video"), x = document.createElement("button");
  let s;
  v.playsInline = v.muted = true;
  x.type = "button"; x.className = "ghost"; x.textContent = "Закрыть"; x.onclick = () => d.close();
  d.onclose = () => { s?.getTracks().forEach(t => t.stop()); d.remove(); };
  d.append(v, x); document.body.append(d); d.showModal();
  try {
    s = await navigator.mediaDevices.getUserMedia({video: {facingMode: "environment"}});
    if (!d.open) return s.getTracks().forEach(t => t.stop());
    v.srcObject = s; await v.play();
    const det = new BarcodeDetector({formats: ["qr_code"]});
    while (d.open) {
      const m = (await det.detect(v).catch(() => [])).map(c => c.rawValue.match(/\/b\/([A-Za-z0-9]+)\/?$/i)).find(Boolean);
      if (m) { d.close(); armed = f; return gotBox(m[1].toUpperCase()); }  // a label read: straight into the field, no questions
      await new Promise(r => setTimeout(r, 200));
    }
  } catch (e) { d.close(); alert("Камера недоступна: " + e.message); }
}
addEventListener("click", e => {
  const b = e.target.closest("[data-nfc],[data-qr]");
  if (!b) return;
  armed = b.parentElement.querySelector("[data-box]"); b.classList.add("on");
  if (b.matches("[data-qr]")) qrScan().finally(() => b.classList.remove("on"));
  else nfcScan().catch(e => { b.classList.remove("on"); alert("NFC: " + e.message); });
});
if ("NDEFReader" in window) navigator.permissions.query({name: "nfc"})
  .then(p => p.state === "granted" && nfcScan().catch(() => addEventListener("click", nfcScan, {once: true}))).catch(() => {});
</script>
{% block main %}{% endblock %}</main>
</body>
</html>
