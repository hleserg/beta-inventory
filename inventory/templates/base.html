<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{% block title %}{{ t.items }}{% endblock %}</title>
<style>
/* design/codex tokens: --bg paper, --fg ink, --card surface, --acc accent, --bad danger */
:root{--bar:78px;--bg:#EFF6F8;--fg:#15313D;--mut:#49636F;--line:#B6CAD0;--card:#FFFFFF;--surface-2:#E3EEF1;--acc:#126985;--accent-deep:#0D526B;--accent-soft:#D9EDF3;--on-acc:#FFFFFF;--bad:#A32E24;--shadow:0 10px 30px #1c292814;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0E202A;--fg:#F1F8FA;--mut:#C0D2D8;--line:#536C77;--card:#19313C;--surface-2:#23404D;--acc:#7DD0E8;--accent-deep:#68C3DC;--accent-soft:#214454;--on-acc:#0E202A;--bad:#E77D70;--shadow:0 10px 30px #0006}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.42 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:8px 16px calc(var(--bar) + 24px + env(safe-area-inset-bottom))}
a{color:var(--acc)}
h1{font-size:1.45rem;margin:.6em 0 .2em;text-wrap:balance}
h2{font-size:1.1rem;margin:1.3em 0 .4em;text-wrap:balance}
p{text-wrap:pretty}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.mut{color:var(--mut);font-size:.9em}
.crumbs{color:var(--mut);font-size:.9em}.crumbs a{display:inline-flex;align-items:center;min-height:44px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:8px 0}
.lrows{padding:0}.lrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:10px 14px;color:var(--fg);text-decoration:none}.lrow+.lrow{border-top:1px solid var(--line)}.lrow svg{flex:none;color:var(--mut)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.right{margin-left:auto}
input,select,textarea,button{font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:8px 12px;max-width:100%}
input,select,textarea{width:100%}
input,select{min-height:44px}
.row input,.row select{width:auto;flex:1;min-width:0}.row>input,.row>select{min-width:6em}  /* a field squeezed by its buttons wraps them instead */
textarea{min-height:8em}
button,.btn{cursor:pointer;background:var(--acc);color:var(--on-acc);border:0;text-decoration:none;display:inline-block;min-height:48px;padding:10px 16px;border-radius:14px;font-weight:750}
.btn{display:inline-flex;align-items:center;justify-content:center}
.ghost{background:var(--accent-soft);color:var(--accent-deep);border:1.5px solid var(--acc)}
.bad{background:var(--bad)}
label{display:block;margin:14px 0 4px;font-weight:600}
.err{color:var(--bad)}
.sw{position:relative}.sw>form{position:absolute;inset:8px 0;display:flex;justify-content:flex-end}
.sw>form button{border-radius:12px}.sw>.card{position:relative;touch-action:pan-y}
.car{position:relative}
.car .strip{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:12px;background:var(--line)}
.car .strip::-webkit-scrollbar{display:none}
.car img{flex:0 0 100%;width:100%;height:60vh;object-fit:contain;scroll-snap-align:center}
.car .cnt{position:absolute;right:10px;bottom:10px;background:#000a;color:#fff;border-radius:10px;padding:2px 8px;font-size:.85em}
.car .x,.car .rot{display:none}
.car.full{position:fixed;inset:0;z-index:20;background:#000}
.car.full .strip{height:100%;border-radius:0;background:#000}
.car.full img{height:100dvh}
.car.full .x{display:block;position:absolute;top:10px;right:10px}
.car.full .rot{display:flex;gap:8px;position:absolute;top:10px;left:10px}
html:has(.car.full){overflow:hidden}
.pic{position:relative;display:inline-flex;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.pic img{pointer-events:none}
.pic.drag{opacity:.5}.pic:first-child:not(:only-child) img{outline:2px solid var(--acc);outline-offset:1px}  /* №64: the first is the face */
.pic button{position:absolute;top:-6px;right:-6px;min-height:0;padding:0 6px;border-radius:50%}
.thumb{width:52px;height:52px;object-fit:cover;border-radius:13px;flex:none;background:var(--surface-2)}
a.line,.line{display:flex;gap:10px;align-items:center;text-decoration:none;color:inherit;padding:8px 0;border-bottom:1px solid var(--line)}
.line>a:not(.btn){display:flex;gap:10px;align-items:center;flex:1;min-width:0;color:inherit;text-decoration:none}
.line .grow{flex:1;min-width:0}.line form{margin:0}
.line .qty{white-space:normal;text-align:right;max-width:6em}  /* «есть, не считал» wraps instead of running over the name */
/* design: home — search field, «под рукой сейчас», rows in a white card */
.search-field{display:flex;align-items:center;gap:12px;min-height:50px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);padding:0 14px;margin:14px 0;color:var(--mut)}
.search-field:focus-within{outline:2px solid var(--acc);outline-offset:1px}
.search-field input{flex:1;min-width:0;border:0;outline:0;background:none;margin:0;padding:0;min-height:46px;font-size:16px;color:var(--fg)}
.now{display:flex;align-items:center;gap:12px;background:var(--accent-soft);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin:14px 0;color:var(--accent-deep)}
.now small{display:block;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.now b{display:block;font-size:22px;font-weight:850;color:var(--fg);margin:6px 0 2px}.now p{margin:0;font-size:13px;color:var(--mut)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:8px}.sec a{font-weight:800;font-size:14px;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
h2{font-size:17px;font-weight:850}
.card.list>.line{padding:10px 12px;min-height:110px}.card.list>.line:last-child{border-bottom:0}
.line .nm{font-size:14px;font-weight:800;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3}
.card.list:not(.types)>.line .nm{min-height:3.9em}
.line .grow>.mut{font-size:12px}.line .grow:has(>.nm)>br{display:none}
.line .qty{font-size:15px;font-weight:850}
/* design: search — back header, chips, dividers, result cards */
.head{display:flex;align-items:center;gap:12px;margin:8px 0 2px}.head>div{min-width:0}.head h1{margin:0;font-size:28px;font-weight:900;overflow-wrap:break-word;hyphens:auto}
.head small{display:block;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.back{display:grid;place-items:center;width:44px;height:44px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.div{display:flex;align-items:center;gap:10px;margin:18px 0 10px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}.div::after{content:"";flex:1;border-top:1px solid var(--line)}
.card.hit{border-radius:18px;padding:12px 14px;margin:0 0 10px}.hit .top{display:flex;gap:12px;align-items:center;color:inherit;text-decoration:none}
.hit .grow{flex:1;min-width:0}.hit .nm{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-weight:800;line-height:1.3;min-height:3.9em}.hit .grow>.mut{display:block;font-size:13px}
.hit .top+.mut{margin-top:10px;border-top:1px solid var(--line)}.hit>.mut{font-size:13px}.hit>.mut a{display:inline-flex;align-items:center;min-height:44px}.hit .qty{font-weight:850;text-align:right}.hit form{margin:10px 0 0}
.line .dots[aria-expanded=true]{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.fbar{position:fixed;z-index:9;left:0;right:0;bottom:calc(var(--bar) + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);padding:8px 12px}
.fbar>div{max-width:720px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.fbar select,.fbar label,.fbar a{flex:none;width:auto;margin:0;min-height:44px;border-radius:99px;font-weight:400;border:1px solid var(--line);background:var(--bg);color:inherit;padding:0 14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none;font-size:.9em}
.fbar select{max-width:11em;text-overflow:ellipsis}
.fbar .on{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.fbar label input{position:absolute;opacity:0;width:1px;height:1px}
.fbar label:has(:focus-visible){outline:2px solid var(--acc);outline-offset:2px}
body:has(.fbar) main{padding-bottom:calc(var(--bar) + 84px + env(safe-area-inset-bottom))}
.put{position:fixed;z-index:9;left:0;right:0;bottom:calc(var(--bar) + env(safe-area-inset-bottom));background:var(--card);border-top:2px solid var(--acc);padding:8px 12px;max-height:calc(100dvh - var(--bar) - 60px);overflow-y:auto}
.put form{flex-wrap:wrap;margin:6px 0 0}.put .row .pick{flex:1 1 100%}
body:has(.put) main{padding-bottom:calc(var(--bar) + 150px + env(safe-area-inset-bottom))}
table{border-collapse:collapse;width:100%}
td{border-bottom:1px solid var(--line);padding:8px 4px;vertical-align:top;font-variant-numeric:tabular-nums}
td a{color:inherit;text-decoration:none;font-weight:600}  /* a row of names, not a wall of blue: bold says «tap me» */
details{margin:8px 0}
summary{cursor:pointer;color:var(--acc)}
.qty{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips a{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:999px;text-decoration:none;font-size:.9em;font-weight:750;background:var(--card);color:var(--fg)}
.seg a{font-size:1em}
.chips a.on{background:var(--accent-soft);color:var(--accent-deep);border-color:var(--acc)}
.md img{max-width:100%}.md pre{overflow-x:auto}.md table td,.md table th{border:1px solid var(--line);padding:4px 6px}
[hidden]{display:none!important}[data-qr]{display:none}.qr [data-qr]{display:inline-block}
label.chk{display:flex;gap:10px;align-items:center;min-height:44px;font-weight:400}.chk input{flex:none;width:auto}
input[type=checkbox],input[type=radio]{width:20px;height:20px;min-height:0;padding:0;margin:0;accent-color:var(--acc)}
.stock{display:grid;grid-template-columns:5em 1fr;gap:8px;margin-top:8px}
.acts{display:flex;flex-direction:column;gap:4px;justify-content:space-between}
.num{display:flex;gap:4px}.num input{text-align:center;min-width:3em}.num button{padding:6px 12px}
.row .num{flex:0 0 auto}.row .num input{flex:0 0 4em}
.stock .num{flex-direction:column-reverse}.stock .num input{font-size:1.2em;padding:6px 2px}.stock .num button{padding:4px 0}
.stock select{grid-column:1/-1}
.mini{padding:6px 9px;font-size:.85em}.mini.on{background:var(--acc);color:var(--on-acc)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg)}dialog::backdrop{background:#0008}
/* the camera: full screen, dark in both themes; our codes green, others red, an AR label under each box */
.scan{position:fixed;inset:0;width:100%;max-width:none;height:100dvh;max-height:none;margin:0;padding:0;border:0;border-radius:0;background:#10262F;color:#fff;--ok:#9EE6C8;--nok:#F08A7E}
.scan[open]{display:flex;flex-direction:column}.scan button{min-height:0}
.scanh{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px}.scanh h2{margin:0;font-size:20px;color:#fff}
.scan .close{display:grid;place-items:center;width:46px;height:46px;padding:0;background:none;border:1.5px solid #fff6;border-radius:12px;color:#fff}
.cam{flex:1;position:relative;overflow:hidden;background:#0B1C22}.cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%}.cam video{object-fit:cover}.cam canvas{pointer-events:none}
.aim{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:min(62vw,240px);aspect-ratio:1;color:#7FD0E6;pointer-events:none}.aim svg{width:100%;height:100%}
.aim span{position:absolute;top:calc(100% + 14px);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:14px;color:#DDEFF4;background:#10262Fb3;padding:4px 10px;border-radius:99px}
.ours{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#10262Fd9;border:1.5px solid var(--ok);color:#fff;border-radius:99px;padding:5px 12px;font-size:14px;font-weight:700;white-space:nowrap}
.tag{position:absolute;transform:translate(-50%,calc(-100% - 10px));background:#10262F;border:1.5px solid var(--ok);color:#fff;border-radius:99px;padding:4px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.scan button.tag{min-height:44px}
.tag.no{border-color:var(--nok);transform:translate(-50%,10px)}
.arc{position:absolute;width:max-content;min-height:44px;max-width:min(68vw,270px);background:#F6FBFC;border:1.5px solid #A9DCEB;color:#15313D;border-radius:14px;padding:8px 12px;font-size:14px;font-weight:700;text-decoration:none;box-shadow:0 4px 14px #0006}
.arc div{display:flex;justify-content:space-between;gap:10px;padding:3px 0}.arc div span:first-child{overflow-wrap:anywhere}.arc div span+span{flex:none;color:#3F5F6B;font-weight:600}
.arc em{display:block;font-style:normal;color:#126985;border-top:1px solid #D4E8EE;margin-top:4px;padding-top:6px}
.scanp{padding:16px 16px calc(16px + env(safe-area-inset-bottom));color:#C0D2D8}.scanp h3{display:flex;align-items:center;gap:8px;margin:0 0 4px;color:#fff;font-size:18px}.scanp p{margin:0 0 12px}.scanp a{color:#9ED8EA}
.camseg{display:grid;grid-template-columns:1fr 1fr;background:#1C3A45;border-radius:12px;padding:3px;margin-bottom:14px}.scan .camseg button{background:none;color:#C0D2D8;min-height:44px;border-radius:10px;padding:6px}.scan .camseg button.on{background:#DDEFF4;color:#15313D}
.scango{width:100%;min-height:48px;background:#126985;color:#fff}
/* №54 the bar: at the thumb, the reach grows left to right; the screen's own action rides above it (.save, .act) */
.bar{position:fixed;z-index:10;left:0;right:0;bottom:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
.bar>div{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:4px}.bar form{display:none}  /* design: the field lives on the home screen, «Найти» leads there */
.tab{flex:none;width:66px;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:14px;color:var(--mut);font-size:12px;font-weight:800;text-decoration:none}
.tab.on{background:var(--accent-soft);color:var(--acc)}
.pill{display:flex;align-items:center;gap:6px;height:48px;margin:0;padding:0 12px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--mut);font-weight:400;cursor:text}
.pill input{flex:1;min-width:0;min-height:0;height:100%;border:0;padding:0;background:none;outline:none;font-size:16px;color:var(--fg)}
.pill input::placeholder{color:var(--mut)}
.pill.on{border:2px solid var(--acc);color:var(--fg)}.pill:focus-within{border:2px solid var(--acc)}
.fab{flex:none;width:52px;height:52px;min-height:0;border-radius:16px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11px;font-weight:800}
.fab.on{box-shadow:0 0 0 4px var(--bg),0 0 0 7px var(--acc)}  /* NFC listens: a tag opens its box */
body:has(main :is(input:not([type=checkbox],[type=radio],[type=file]),textarea):focus){--bar:0px}  /* the keyboard is up: the page's own field wins the space */
body:has(main :is(input:not([type=checkbox],[type=radio],[type=file]),textarea):focus) .bar{display:none}
@media print{.bar,.fbar,.put{display:none}}
.pick{position:relative;display:flex;width:100%}.row .pick{flex:1;width:auto;min-width:0}.stock .pick{grid-column:1/-1}
.pick input{flex:1;min-width:0;padding-right:2.4em}
.pick select{position:absolute;inset:0;opacity:0;pointer-events:none}
.pick>button{position:absolute;right:1px;top:1px;bottom:1px;min-height:0;background:none;color:var(--mut);padding:0 12px}
.pickl,.pickall{display:flex;flex-direction:column}
.pickl{flex-basis:100%;grid-column:1/-1;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.pickl button,.pickall button,.pickm>.pmore{background:none;color:inherit;text-align:left;border-radius:0;padding:11px 12px;border-top:1px solid var(--line)}
.pickl button:first-child{border-top:0}.pickl .pmore,.pickm .pmore{color:var(--acc)}.pickm>.pmore{display:block;width:100%}.pickl>div{padding:11px 12px}
.pickm{padding:0;margin:12px auto auto;width:min(92vw,480px);border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg)}
.pickm::backdrop{background:#0008}.pickm>div{display:flex;gap:8px;padding:8px}.pickm input{flex:1;min-width:0}
.pickall{max-height:70vh;overflow-y:auto}.pickl>*,.pickall>*{flex-shrink:0}
form[data-sent] button{opacity:.5}
/* settings.html: a row per setting, radios as a segmented choice, switches, the save bar */
.choice{flex:none;display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)} .choice label{margin:0;min-width:44px;height:44px;display:grid;place-items:center;padding:0 12px;font-weight:400} .choice input{position:absolute;opacity:0} .choice label:has(:checked){background:var(--acc);color:var(--on-acc);font-weight:600} .choice label:has(:focus-visible){outline:2px solid var(--acc);outline-offset:-2px}
.src{display:inline-block;font-size:12px;font-weight:600;line-height:20px;padding:0 8px;border-radius:99px;border:1px solid var(--line);color:var(--mut);white-space:nowrap} .src.warn{border-color:var(--bad);color:var(--bad)} .src.ch{border-color:var(--acc);color:var(--acc)}
.card.list{padding:0}
.set{padding:10px 16px;border-bottom:1px solid var(--line)} .set:last-child{border-bottom:0}
.seth{display:flex;align-items:center;gap:8px;min-height:28px} .seth .nm{flex:1;min-width:0;margin:0;font-weight:600}
.setc{display:flex;align-items:center;gap:12px;margin-top:6px}
.setc.side p{flex:1;min-width:0;margin:0} .setc.side .num{flex:none;margin-left:auto} .setc.side .num input{flex:0 0 4.5em;width:4.5em;min-width:0}
.lbl img{height:96px;width:auto;max-width:calc(100% - 56px);border:1px solid var(--line);border-radius:4px;background:#fff} .lbl .ib{margin-left:auto}
.sm{font-size:13px}
.gh{margin:22px 0 4px}
.code{display:flex;align-items:flex-start;gap:4px;padding:6px 2px 6px 12px;margin-top:6px;background:var(--bg);border:1px solid var(--line);border-radius:8px} .code pre{flex:1;min-width:0;margin:0;font:13px/1.5 ui-monospace,monospace;white-space:pre-wrap;word-break:break-all}
.warn{display:flex;gap:8px;align-items:flex-start;margin:0;font-size:13px}
.save{position:fixed;z-index:10;left:0;right:0;bottom:calc(var(--bar) + env(safe-area-inset-bottom));display:flex;justify-content:flex-end;align-items:center;gap:12px;padding:10px 12px;background:var(--card);border-top:1px solid var(--line)}
input[type=checkbox].tgl{appearance:none;flex:none;width:52px;height:32px;margin:0;border-radius:99px;background:var(--line);position:relative;cursor:pointer} .tgl::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .15s} input[type=checkbox].tgl:checked{background:var(--acc)} .tgl:checked::after{transform:translateX(20px)}
body:has(.save:not([hidden])) main{padding-bottom:calc(var(--bar) + 88px + env(safe-area-inset-bottom))}
.tree details{margin:0}
.tn{display:flex;align-items:center;gap:4px;min-height:56px;padding:6px 8px 6px 4px;border-bottom:1px solid var(--line)}
.tn.l1{padding-left:24px}.tn.l2{padding-left:44px}.tn.l3{padding-left:64px}.tn.l4{padding-left:84px}
a.tn{color:inherit;text-decoration:none}.tn.it{min-height:44px}.tn.it .qty{padding-right:8px}

summary.lrow{list-style:none;cursor:pointer} summary.lrow::-webkit-details-marker{display:none}
.lrows>details+details{border-top:1px solid var(--line)}
/* №54 screen 6: the new-item form */
body:not(:has(.bar)){--bar:0px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.chips.scroll a{flex:none}
