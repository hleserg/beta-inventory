# Settings go in .env next to this file (see README), not here.
services:
  inventory:
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./data:/data
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      TZ: ${TZ:-UTC}
      LABEL_W_MM: ${LABEL_W_MM:-25}
      LABEL_H_MM: ${LABEL_H_MM:-15}
      LABEL_DPI: ${LABEL_DPI:-300}
    restart: unless-stopped
