# Settings go in .env next to this file (see README), not here.
services:
  inventory:
    image: ghcr.io/hleserg/beta-inventory:latest  # ready image from CI; `up -d --build` builds this checkout instead
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./data:/data
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    healthcheck:  # `docker compose ps` says healthy; the image has no curl, python is there
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # The door for agents outside the LAN (ChatGPT, Claude on the web): docs/outside.md.
  # Off unless .env says COMPOSE_PROFILES=tunnel. Publishes nothing on the host: it dials out to Cloudflare.
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
      # QUIC (UDP) is often throttled on home ISPs and the tunnel drops; TCP holds
      TUNNEL_TRANSPORT_PROTOCOL: ${TUNNEL_TRANSPORT_PROTOCOL:-http2}
    depends_on:
      - inventory
    restart: unless-stopped
    profiles:
      - tunnel
